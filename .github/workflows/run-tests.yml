name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-hst-targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: |
          ruff check

      - name: Mypy
        run: |
          mypy tests

      - name: Sphinx
        run: |
          sphinx-build -W -b html docs docs/_build

      - name: PyMarkdown
        run: |
          pymarkdown scan docs/ .cursor/ README.md CONTRIBUTING.md

  test:
    name: Test rms-hst-targets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        if: matrix.python-version != '3.12'
        run: |
          python -m pytest --cov=targets --cov-report=xml -n auto tests

      # Coverage is measured on 3.10, 3.11 and 3.13, which all reach the same lines.
      # It is skipped on 3.12 alone: branch coverage cannot use sys.monitoring there
      # (coverage/core.py requires PYBEHAVIOR.branch_right_left, false on 3.12), so
      # coverage falls back to the settrace-based CTracer. That turns
      # test_hst_repairs_output, which runs hst_repairs over all 8557 corpus entries,
      # from 11 seconds into 355, and the job from 1m25s into 10m10s.
      - name: Test without coverage (see note above)
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest --no-cov -n auto tests

      - name: Print coverage report
        if: matrix.python-version != '3.12'
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v6
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
